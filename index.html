<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEGION — SHINOBI ONLINE</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0f121d;
      overflow: hidden;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      user-select: none;
    }
    input, button, textarea, select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    #game {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 상단 유저 정보 미니 바 */
    #userBar {
      position: absolute;
      top: 12px;
      right: 270px;
      z-index: 50;
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.35);
      color: #fff;
      font-size: 13px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }
    #userBar .nick { color: #feca57; font-weight: bold; }
    #userBar button {
      background: #222f3e;
      color: #c8d6e5;
      border: 1px solid #576574;
      padding: 3px 9px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    #userBar button:hover { background: #341f97; color: #fff; border-color: #5f27cd; }
    #userBar button.save-btn { background: #10ac84; color: #fff; border-color: #1dd1a1; }
    #userBar button.save-btn:hover { background: #01a3a4; }

    /* 로그인 & 회원가입 모달 오버레이 */
    #authOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 11, 20, 0.82);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }

    .auth-modal {
      width: 440px;
      background: linear-gradient(145deg, #182033, #0f1422);
      border: 2px solid #f1c40f;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.25), 0 20px 40px rgba(0, 0, 0, 0.8);
      padding: 28px 32px 32px;
      color: #fff;
      position: relative;
      animation: modalPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes modalPop {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .auth-header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #ffd32a, #ff9f43, #ff4757);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 159, 67, 0.3);
    }
    .auth-header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #8395a7;
    }
    .server-status {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(16, 172, 132, 0.2);
      color: #1dd1a1;
      border: 1px solid rgba(29, 209, 161, 0.3);
    }

    /* 탭 */
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: #0b0f19;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #222f3e;
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 9px;
      font-size: 14px;
      font-weight: bold;
      color: #8395a7;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: #f1c40f;
      color: #1e272e;
      box-shadow: 0 2px 8px rgba(241, 196, 15, 0.4);
    }

    /* 폼 입력 필드 */
    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #c8d6e5;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      background: #0b0f19;
      border: 1px solid #2e3b52;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #f1c40f;
      box-shadow: 0 0 10px rgba(241, 196, 15, 0.25);
    }

    .auth-msg {
      font-size: 12px;
      margin-bottom: 14px;
      min-height: 18px;
      text-align: center;
    }
    .auth-msg.error { color: #ff6b6b; }
    .auth-msg.success { color: #1dd1a1; }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      border: none;
      border-radius: 9px;
      color: #1e272e;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(241, 196, 15, 0.35);
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #feca57, #ff9f43);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(241, 196, 15, 0.5);
    }
    .btn-guest {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #485460;
      border-radius: 8px;
      color: #a4b0be;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-guest:hover {
      border-color: #718093;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <!-- 상단 로그인 계정 바 -->
  <div id="userBar">
    <span>⚔️ <span class="nick" id="userNickDisplay">모험가</span>님</span>
    <button class="save-btn" id="btnManualSave" title="현재 진행 상황을 Python DB에 즉시 저장합니다">💾 DB 저장</button>
    <button id="btnLogout">로그아웃</button>
  </div>

  <!-- 로그인 & 회원가입 모달 -->
  <div id="authOverlay">
    <div class="auth-modal">
      <div class="auth-header">
        <h1>LEGION : SHINOBI</h1>
        <p>파이썬 SQLite 데이터베이스 연동 시스템</p>
        <span class="server-status" id="serverStatusBadge">🟢 Python DB 서버: 127.0.0.1:8000</span>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">로그인</div>
        <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">회원가입</div>
      </div>

      <!-- 로그인 폼 -->
      <form id="formLogin" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" id="loginUsername" placeholder="아이디 입력" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="loginPassword" placeholder="비밀번호 입력" autocomplete="current-password" required />
        </div>
        <div class="auth-msg" id="loginMsg"></div>
        <button type="submit" class="btn-submit" id="btnLoginSubmit">로그인하여 게임 시작</button>
        <p style="text-align:center; font-size:12px; color:#feca57; margin: 8px 0 0;">※ 회원가입 또는 로그인해야 캐릭터 스킬과 게임이 작동합니다.</p>
      </form>

      <!-- 회원가입 폼 -->
      <form id="formRegister" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>아이디 (ID)</label>
          <input type="text" id="regUsername" placeholder="영문/숫자 아이디" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label>비밀번호 (Password)</label>
          <input type="password" id="regPassword" placeholder="비밀번호" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label>이름 (Name)</label>
          <input type="text" id="regName" placeholder="실명 또는 이름" required />
        </div>
        <div class="form-group">
          <label>닉네임 (Nickname)</label>
          <input type="text" id="regNickname" placeholder="게임 내 표시될 닉네임" required />
        </div>
        <div class="auth-msg" id="regMsg"></div>
        <button type="submit" class="btn-submit" id="btnRegSubmit">회원가입 완료</button>
        <button type="button" class="btn-guest" onclick="switchAuthTab('login')">로그인 화면으로 돌아가기</button>
      </form>
    </div>
  </div>

  <div id="game"></div>

  <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API_URL = isLocal ? 'http://127.0.0.1:8000' : '';
    window.API_URL = API_URL;
    window.currentUser = null;

    // [중요] 회원가입 & 로그인 입력창에서 스페이스바, 방향키, 영문/숫자 등 모든 키가 씹히지 않도록 완벽 보장
    function setupKeyboardProtection() {
      const authInputs = document.querySelectorAll('#authOverlay input');
      authInputs.forEach(input => {
        ['keydown', 'keyup', 'keypress'].forEach(evtName => {
          input.addEventListener(evtName, (e) => {
            // 인풋창 내부 타이핑 시 상위 Phaser 윈도우 키보드 리스너로 이벤트가 전달되어 차단되는 것을 방지
            e.stopPropagation();
          }, false);
        });

        input.addEventListener('focus', () => {
          if (window.phaserGame && window.phaserGame.scene) {
            window.phaserGame.scene.scenes.forEach(s => {
              if (s.input && s.input.keyboard) {
                s.input.keyboard.enabled = false;
              }
            });
          }
        });
      });

      // 윈도우 레벨 캡처 가드: 인풋 포커스 상태에서 눌린 키는 절대 브라우저 기본 동작이 취소되지 않도록 보호
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          e.stopPropagation();
        }
      }, true);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupKeyboardProtection);
    } else {
      setupKeyboardProtection();
    }

    // 탭 전환
    function switchAuthTab(type) {
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const loginMsg = document.getElementById('loginMsg');
      const regMsg = document.getElementById('regMsg');
      loginMsg.innerText = '';
      regMsg.innerText = '';

      if (type === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
        setTimeout(() => document.getElementById('loginUsername')?.focus(), 50);
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        formRegister.style.display = 'block';
        formLogin.style.display = 'none';
        setTimeout(() => document.getElementById('regUsername')?.focus(), 50);
      }
    }

    // 로컬스토리지 하이브리드 영구 백업 시스템 (Vercel 서버리스 초기화 완벽 방어)
    const STORAGE_KEY_ACCOUNTS = 'legion_hybrid_accounts_v1';
    const STORAGE_KEY_ACTIVE = 'legion_active_user_v1';

    function getLocalAccounts() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY_ACCOUNTS) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveLocalAccount(user, rawPassword = null) {
      if (!user || !user.username) return;
      const accounts = getLocalAccounts();
      const existing = accounts[user.username] || {};
      accounts[user.username] = {
        ...existing,
        ...user,
        password: rawPassword || existing.password || '',
        updatedAt: Date.now()
      };
      localStorage.setItem(STORAGE_KEY_ACCOUNTS, JSON.stringify(accounts));
      localStorage.setItem(STORAGE_KEY_ACTIVE, user.username);
    }

    // 서버가 리셋되었을 때 로컬 계정을 서버 DB에 자동 복구 (Self-heal)
    async function selfHealServerAccount(localAcc) {
      if (!localAcc || !localAcc.username || !localAcc.password) return;
      try {
        // 1. 서버에 계정 재등록 시도
        await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: localAcc.username,
            password: localAcc.password,
            name: localAcc.name || localAcc.username,
            nickname: localAcc.nickname || localAcc.username
          })
        });
        // 2. 최신 게임 진행 데이터 복원 저장
        await fetch(`${API_URL}/api/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: localAcc.username,
            level: localAcc.level || 1,
            exp: localAcc.exp || 0,
            hp: localAcc.hp || 100,
            mp: localAcc.mp || 80,
            job_tier: localAcc.job_tier || 1,
            kills: localAcc.kills || 0,
            quest_status: localAcc.quest_status || 'NOT_STARTED',
            quest_kills: localAcc.quest_kills || 0
          })
        });
        console.log(`[Self-Heal] Vercel 서버 DB에 [${localAcc.username}] 계정 복원 완료`);
      } catch (err) {
        console.warn('[Self-Heal] 백그라운드 복원 건너뜀 (오프라인 모드)');
      }
    }

    // 회원가입 요청
    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const name = document.getElementById('regName').value.trim();
      const nickname = document.getElementById('regNickname').value.trim();
      const msg = document.getElementById('regMsg');
      const btn = document.getElementById('btnRegSubmit');

      msg.className = 'auth-msg';
      msg.innerText = '회원가입 처리 중...';
      btn.disabled = true;

      const localUserData = {
        username,
        name,
        nickname,
        level: 1,
        exp: 0,
        hp: 100,
        mp: 80,
        job_tier: 1,
        kills: 0,
        quest_status: 'NOT_STARTED',
        quest_kills: 0
      };

      try {
        const res = await fetch(`${API_URL}/api/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, name, nickname })
        });
        const data = await res.json();

        if (res.ok) {
          // 서버 및 로컬스토리지 동시 영구 저장
          saveLocalAccount(data.user || localUserData, password);
          msg.className = 'auth-msg success';
          msg.innerText = `회원가입 완료! [${nickname}]님 환영합니다. 로그인 중...`;
          setTimeout(() => {
            applyUserSession(data.user || localUserData);
          }, 600);
          return;
        } else {
          // 서버 에러인 경우 중복 계정인지 체크
          if (data.detail && data.detail.includes('이미 존재하는')) {
            msg.className = 'auth-msg error';
            msg.innerText = data.detail;
            return;
          }
          // 기타 Vercel 서버리스 일시 장애 시 로컬스토리지 백업으로 진행 허용
          saveLocalAccount(localUserData, password);
          msg.className = 'auth-msg success';
          msg.innerText = `회원가입 완료 (로컬 영구 백업 보관)! [${nickname}]님 환영합니다.`;
          setTimeout(() => applyUserSession(localUserData), 600);
          return;
        }
      } catch (err) {
        // 서버 오프라인이어도 브라우저 로컬스토리지로 가입 및 영구 보존 지원
        saveLocalAccount(localUserData, password);
        msg.className = 'auth-msg success';
        msg.innerText = `회원가입 완료 (영구 로컬 백업 모드)! [${nickname}]님 환영합니다.`;
        setTimeout(() => applyUserSession(localUserData), 600);
      } finally {
        btn.disabled = false;
      }
    }

    // 로그인 요청
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const msg = document.getElementById('loginMsg');
      const btn = document.getElementById('btnLoginSubmit');

      msg.className = 'auth-msg';
      msg.innerText = '로그인 확인 중...';
      btn.disabled = true;

      const accounts = getLocalAccounts();
      const localAcc = accounts[username];

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          saveLocalAccount(data.user, password);
          msg.className = 'auth-msg success';
          msg.innerText = `로그인 성공! ${data.user.nickname}님의 데이터를 불러옵니다...`;
          setTimeout(() => {
            applyUserSession(data.user);
          }, 500);
          return;
        } else {
          // 서버에 계정이 없거나(Vercel 서버리스 재부팅으로 DB 파일 초기화된 경우)
          if (localAcc && localAcc.password === password) {
            msg.className = 'auth-msg success';
            msg.innerText = `브라우저 안전 백업 데이터로부터 [${localAcc.nickname}] 계정을 자동 복구합니다!`;
            // Vercel 서버 DB에 자동 복구 전송
            selfHealServerAccount(localAcc);
            setTimeout(() => applyUserSession(localAcc), 600);
            return;
          }
          msg.className = 'auth-msg error';
          msg.innerText = data.detail || '아이디 또는 비밀번호가 틀렸습니다.';
        }
      } catch (err) {
        // 서버 연결 실패 시 로컬 백업으로 로그인 검증
        if (localAcc && localAcc.password === password) {
          msg.className = 'auth-msg success';
          msg.innerText = `로컬 백업 데이터로 로그인되었습니다 (${localAcc.nickname}님)!`;
          setTimeout(() => applyUserSession(localAcc), 600);
          return;
        }
        msg.className = 'auth-msg error';
        msg.innerText = '아이디 또는 비밀번호를 다시 확인해주세요.';
      } finally {
        btn.disabled = false;
      }
    }

    // 세션 적용 및 게임 화면 진입 (로그인 완료 시 게임 및 스킬 활성화)
    function applyUserSession(user) {
      window.currentUser = user;
      document.getElementById('authOverlay').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('authOverlay').style.display = 'none';
      }, 350);

      const userBar = document.getElementById('userBar');
      userBar.style.display = 'flex';
      document.getElementById('userNickDisplay').innerText = `${user.nickname} (Lv.${user.level})`;

      // Phaser 씬이 준비되었으면 데이터 주입 및 스킬/물리/키보드 활성화
      if (window.phaserGame && window.phaserGame.scene) {
        window.phaserGame.scene.scenes.forEach(s => {
          if (s.input && s.input.keyboard) {
            s.input.keyboard.enabled = true;
            s.input.keyboard.preventDefault = false;
            s.input.keyboard.clearCaptures();
          }
        });
        const gameScene = window.phaserGame.scene.getScene('GameScene');
        if (gameScene && gameScene.loadUserData) {
          gameScene.loadUserData(user);
        }
      }
    }

    // 수동 저장 버튼
    document.getElementById('btnManualSave').addEventListener('click', async () => {
      if (!window.currentUser || window.currentUser.username === 'guest') {
        alert('게스트 계정은 서버에 저장되지 않습니다. 회원가입 후 이용해주세요!');
        return;
      }
      if (window.saveGameDataToServer) {
        const ok = await window.saveGameDataToServer(true);
        if (ok) alert('현재 레벨과 진행 상황이 Python DB에 안전하게 저장되었습니다!');
      }
    });

    // 로그아웃
    document.getElementById('btnLogout').addEventListener('click', () => {
      if (confirm('로그아웃하고 로그인 화면으로 돌아가시겠습니까?')) {
        location.reload();
      }
    });

    // 최근 로그인 아이디 자동완성
    const lastActiveId = localStorage.getItem(STORAGE_KEY_ACTIVE);
    if (lastActiveId) {
      const loginUserInput = document.getElementById('loginUsername');
      if (loginUserInput) {
        loginUserInput.value = lastActiveId;
        const pwdInput = document.getElementById('loginPassword');
        if (pwdInput) setTimeout(() => pwdInput.focus(), 100);
      }
    }

    // 전역 세이브 헬퍼 (서버 + 로컬스토리지 동시 저장)
    window.syncLocalProgress = (progressData) => {
      if (!window.currentUser || !window.currentUser.username) return;
      saveLocalAccount({
        ...window.currentUser,
        ...progressData
      });
    };

    // 서버 상태 체크
    async function checkServer() {
      try {
        const res = await fetch(`${API_URL}/`);
        if (res.ok) {
          document.getElementById('serverStatusBadge').innerText = isLocal ? '🟢 Python DB 서버: 127.0.0.1:8000' : '🟢 Vercel 온라인 (클라우드/로컬 이중 백업)';
        }
      } catch (e) {
        document.getElementById('serverStatusBadge').innerText = isLocal ? '🔴 Python 서버 미응답 (python server.py)' : '🟢 Vercel 온라인 (로컬 안전 백업 활성)';
      }
    }
    checkServer();
  </script>



  <script type="module" src="/src/main.js"></script>
</body>
</html>
